name: release
on:
  push:
    tags: ["v*"]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          # Forever game version is 1.60.1 (Interface 16001). No CurseForge/Wago tokens, so only a GitHub release is produced.
          args: -g 1.60.1
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
